services:
  postgres:
    image: postgres:15-alpine
    container_name: pix-postgres
    environment:
      POSTGRES_USER: pix_user
      POSTGRES_PASSWORD: pix_password
      POSTGRES_DB: pix_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pix_user -d pix_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pix-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-1:
    build: .
    container_name: pix-api-1
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: "postgresql://user:password@localhost:5432/pix_db"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: "15m"
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      REFRESH_TOKEN_EXPIRES_IN: "7d"
      CORS_ORIGIN: "*"
      THROTTLER_LIMIT: 1000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-2:
    build: .
    container_name: pix-api-2
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: "postgresql://pix_user:pix_password@postgres:5432/pix_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "production_secret_key_change_in_real_systems_01"
      JWT_EXPIRES_IN: "15m"
      REFRESH_TOKEN_SECRET: "production_refresh_secret_key_change_in_real_systems_01"
      REFRESH_TOKEN_EXPIRES_IN: "7d"
      CORS_ORIGIN: "*"
      THROTTLER_LIMIT: 1000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-3:
    build: .
    container_name: pix-api-3
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: "postgresql://pix_user:pix_password@postgres:5432/pix_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "production_secret_key_change_in_real_systems_01"
      JWT_EXPIRES_IN: "15m"
      REFRESH_TOKEN_SECRET: "production_refresh_secret_key_change_in_real_systems_01"
      REFRESH_TOKEN_EXPIRES_IN: "7d"
      CORS_ORIGIN: "*"
      THROTTLER_LIMIT: 1000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: pix-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3

volumes:
  postgres_data:
  redis_data:
