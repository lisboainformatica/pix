services:
  postgres-test:
    image: postgres:15-alpine
    container_name: pix-postgres-test
    environment:
      POSTGRES_USER: pix_user_test
      POSTGRES_PASSWORD: pix_password_test
      POSTGRES_DB: pix_db_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pix_user_test -d pix_db_test"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: pix-redis-test
    ports:
      - "6380:6379"
    volumes:
      - redis_data_test:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data_test:
  redis_data_test:
